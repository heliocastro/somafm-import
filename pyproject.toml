[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "somafm"
version = "0.33.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Helio Chissini de Castro", email = "dev@heliocastro.info" }
]
dependencies = [
  "appdirs>=1.4.4",
  "click>=8.1.7",
  "defusedxml>=0.7.1",
  "lxml>=6.1.0",
  "pydantic-settings>=2.14.2",
  "requests>=2.28.1",
  "rich>=15.0.0",
]

[project.scripts]
soma = "somafm.__main__:main"

[dependency-groups]
dev = [
  "lxml-stubs>=0.5.1",
  "prek>=0.3.9",
  "pytest-cov>=5.0.0",
  "ruff>=0.3.7",
  "ty>=0.0.31",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
log_cli = true
log_cli_level = "INFO"
pythonpath = "src"

[tool.ruff]
fix = true
line-length = 120

# Exclude a variety of commonly ignored directories.
extend-exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

target-version = "py313"

[tool.ruff.lint]
extend-select = [
  "E",  # pycodestyle error
  "W",  # pycodestyle warning
  "F",  # pyflakes
  "A",  # flakes8-builtins
  "C4",  # flake8-comprehensions
  "Q",  # flake8-quotes
  "SIM",  # flake8-simplify
  "PTH",  # flake8-use-pathlib
  "I",  # isort
  "N",  # pep8 naming
  "UP",  # pyupgrade
  "S",  # bandit
  "ANN",  # Annotation
]
ignore = [
  "SIM105",  # Suggest contextlib instead of try/except with pass
]
# Unlike Flake8, default to a complexity level of 10.
mccabe.max-complexity = 10
per-file-ignores = {}
flake8-tidy-imports.ban-relative-imports = "all"
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
case-sensitive = true
